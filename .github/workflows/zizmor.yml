name: GitHub Actions Security Analysis with zizmor 🌈

on:
  push:
    branches: ["main"]
    paths:
      - ".github/**" # only trigger when GitHub Actions workflow files or related configuration files change
  pull_request:
    branches: ["**"]
    paths:
      - ".github/**" # only trigger when GitHub Actions workflow files or related configuration files change
permissions: {}

concurrency:
  group: "zizmor-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  zizmor:
    name: Zizmor 🌈 Security Analysis
    runs-on: ubuntu-26.04-arm
    permissions:
      security-events: write # Required to upload security analysis results
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          persona: "pedantic"
